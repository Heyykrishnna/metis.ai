name: metis-foundation
services:
  metadata:
    profiles: ["local-metadata"]
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: metis_metadata
      POSTGRES_USER: metis_metadata
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD:?Run node scripts/local-env.mjs first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - metadata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metis_metadata -d metis_metadata"]
      interval: 5s
      timeout: 3s
      retries: 10
  analytics:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: metis_analytics_fixture
      POSTGRES_USER: metis_fixture_admin
      POSTGRES_PASSWORD: ${FIXTURE_DB_PASSWORD:?Run node scripts/local-env.mjs first}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - analytics:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U metis_fixture_admin -d metis_analytics_fixture",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  metadata:
  analytics:
