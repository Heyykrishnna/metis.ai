name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: metis_test_admin
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-disposable-ci
          POSTGRES_DB: metis_foundation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metis_test_admin -d metis_foundation_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://metis_test_admin:${{ github.run_id }}-${{ github.run_attempt }}-disposable-ci@127.0.0.1:5432/metis_foundation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: node scripts/skills.mjs --link
      - run: node scripts/check-foundation.mjs
      - run: npm --prefix backend run check
      - run: npm --prefix frontend run check
      - run: node scripts/test-database.mjs
      - run: node scripts/smoke.mjs
      - run: npm --prefix backend audit --audit-level=moderate
      - run: npm --prefix frontend audit --audit-level=moderate
      - run: git diff --exit-code
